name: Deploy qs-viewer to Vercel

on:
  push:
    branches: [ qs-viewer-enhance ]
    paths:
      - 'qs-viewer/**'
  pull_request:
    paths:
      - 'qs-viewer/**'

# cancel in-flight deploys for the same PR/branch
concurrency:
  group: vercel-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qs-viewer/package-lock.json
      - name: Install dependencies
        working-directory: qs-viewer
        run: npm ci
      - name: Deploy to Vercel
        id: vercel
        # Pin action version by commit hash to maximize trust, ref: https://securitylab.github.com/research/github-actions-building-blocks/
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: qs-viewer
          # production deploy on push, stage/preview deploy on PR
          vercel-args: ${{ github.event_name == 'push' && '--prod' || '' }}
          github-deployment: true
      - name: Print deployment URL
        run: echo "Deployed to ${{ steps.vercel.outputs.preview-url }}"
